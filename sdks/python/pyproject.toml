[project]
name = "todo-api-client"
version = "0.1.0"
description = "SDK Python da ToDo API, gerado a partir de docs/openapi.yaml."
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx2>=2.13.1,<3",
    "attrs>=22.2.0",
]

[dependency-groups]
dev = [
    "openapi-python-client>=0.26",
    "pytest>=8",
]

[tool.poetry]
packages = [{ include = "todo_api_client" }]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
extend-exclude = "todo_api_client/generated"
