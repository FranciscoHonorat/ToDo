name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
    contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    backend:
        name: Backend · lint, unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v7

            # O cache "poetry" do setup-python precisa do Poetry já instalado
            - name: Install Poetry
              run: |
                  pipx install poetry==2.3.2

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.14'
                  cache: poetry
                  cache-dependency-path: backend/poetry.lock

            - name: Install dependencies
              run: |
                  poetry install --no-interaction

            - name: Lint with flake8
              run: |
                  poetry run flake8 .

            - name: Check formatting with black
              run: |
                  poetry run black --check .

            - name: Run unit, integration and functional tests
              run: |
                  poetry run pytest --maxfail=1 --disable-warnings -q

    backend-security:
        name: Backend · security checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: '3.14'

            - name: Install bandit
              run: |
                  python -m pip install --upgrade pip
                  pip install bandit

            - name: Run bandit security linter
              run: |
                  bandit -r . -x ./tests
    frontend:
        name: Frontend · typecheck, unit tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v7

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: |
                  npm ci

            - name: Type check
              run: |
                  npm run typecheck

            - name: Run unit tests
              run: |
                  npm run test:run
    infra:
        name: Infra · OpenTofu fmt, validate
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: infra/tofu
        steps:
            - uses: actions/checkout@v7
            - name: Set up OpenTofu
              uses: opentofu/setup-opentofu@v2
              with:
                  tofu_version: 1.13.1
            - name: Check OpenTofu formatting
              run: |
                  tofu fmt -check
            - name: Initialize OpenTofu
              run: |
                  tofu init -backend=false
            - name: Validate OpenTofu configuration
              run: |
                  tofu validate
