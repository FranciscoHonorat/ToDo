[project]
name = "todo-backend"
version = "0.1.0"
description = "API e CLI do ToDo (domain / application / persistence / api / ui)"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "flake8>=7.5.0",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pre-commit>=4.0",
    "black>=26.10.1",
]
load = [
    "locust>=2.46.7",
]

# Aplicação, não biblioteca: o Poetry só gerencia dependências, não empacota o código.
[tool.poetry]
package-mode = false

# Teste de carga (load/): só instala com `poetry install --with load`.
[tool.poetry.group.load]
optional = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: sobe o servidor real (uvicorn) e testa via HTTP"]

[tool.importlinter]
root_packages = ["domain", "application", "persistence", "api", "ui"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas: adaptadores -> application -> domain"
type = "layers"
layers = ["api | ui", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Domain é puro: não conhece frameworks nem banco"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = ["application", "persistence", "api", "ui", "fastapi", "pydantic", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Application depende só do domain (DIP): não conhece persistência nem HTTP"
type = "forbidden"
source_modules = ["application"]
forbidden_modules = ["persistence", "api", "ui", "fastapi", "pydantic", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Persistence implementa portas do domain, não usa casos de uso nem adaptadores"
type = "forbidden"
source_modules = ["persistence"]
forbidden_modules = ["application", "api", "ui", "fastapi"]

[[tool.importlinter.contracts]]
name = "Adaptadores de entrada não instanciam persistência (só a composition root)"
type = "forbidden"
source_modules = ["api", "ui"]
forbidden_modules = ["persistence", "sqlite3"]

[[tool.importlinter.contracts]]
name = "Adaptadores de entrada são independentes entre si"
type = "independence"
modules = ["api", "ui"]

[tool.black]
line-length = 120   # igual ao max-line-length do .flake8
